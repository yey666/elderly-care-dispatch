server:
  port: 8080

spring:
  application:
    name: elderly-care-dispatch
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意把 elderly_care_dispatch 换成了你实际建的库名
    url: jdbc:mysql://localhost:3306/elderly_care_dispatch?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: 123456

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    # 开启驼峰命名转换（数据库的 dispatch_record 自动映射到实体类的 dispatchRecord）
    map-underscore-to-camel-case: true
    # 在控制台打印 SQL 语句，方便你调试看日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 逻辑删除配置（0未删，1已删）
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Knife4j 接口文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn